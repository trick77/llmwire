# Model profiles.
#
# Hardcoded and embedded, never fetched at runtime. Published catalogues
# (models.dev, LiteLLM's model_prices_and_context_window.json) are an AUTHORING
# source to cross-check against; a runtime dependency on one buys a network
# call, a cache, a staleness window and a fallback table, and this file is the
# fallback table.
#
# Every entry marked `verified: measured` was probed in eval_probe_test.go
# against the live endpoint, and FINDINGS.md records what each probe saw. The
# flag is per profile; each bit's comment says MEASURED or NOT measured, and a
# NOT measured bit is the vendor's documentation carried until a probe reads it.
# Six of the measurements contradict a vendor doc. Where they disagree, this
# file follows the measurement.
#
# Adding a model: follow ONBOARDING.md. In short: write the entry, run
# `LLMWIRE_EVAL=1 go test -run Probe`, mark each bit's comment MEASURED or NOT
# measured, and set `verified: measured` once the profile has been probed. An
# unmeasured field is left absent rather than guessed — absent means "assume
# nothing", not "assume the default".

# Providers: the host and account a profile is reached through. The URL lives
# HERE, once, so an application supplies LLMWIRE_<PROVIDER>_API_KEY and nothing
# else. LLMWIRE_<PROVIDER>_BASE_URL exists only for a provider that ships no
# host; beside a shipped host it is refused, not honoured: a different host
# is a different entry here. Roots only: no /chat/completions, the client
# appends the route; no query string, a key there is echoed by every error
# body.
providers:
  zai:
    # The GENERAL host. NEVER /api/coding/paas/v4: the Coding Plan host is
    # restricted to Z.ai's own coding tools and refuses everything else. No
    # /v1 on this vendor.
    base_url: https://api.z.ai/api/paas/v4
  mimo:
    # The Token Plan host, which is what `provider: mimo` means throughout this
    # file; the pay-as-you-go API is api.xiaomimimo.com/v1 with a different
    # key, and would be its own provider. Sold as opencode's backend: a
    # neutral User-Agent is refused as a bot, so FromEnv presents as that
    # client (Config.EmulateOpenCode) for every profile on this provider.
    base_url: https://token-plan-sgp.xiaomimimo.com/v1
    emulate_opencode: true
  openai:
    base_url: https://api.openai.com/v1
  # A self-hosted gateway has no public host: LLMWIRE_LITELLM_BASE_URL is
  # required.
  litellm: {}

profiles:
  # ---------------------------------------------------------------------------
  # Z.ai, general (pay-as-you-go) host. NOT the Coding Plan host, which is
  # restricted to that plan's own tools and refuses calls from elsewhere.
  # ---------------------------------------------------------------------------
  - id: glm-5.3-flash
    endpoint: chat
    wire_model_id: glm-5.3-flash
    provider: zai
    verified: measured

    # MEASURED, and the single most expensive quirk in this file. This endpoint
    # ACCEPTS max_completion_tokens and then IGNORES it: a request capping at 16
    # returned 481 completion tokens with finish_reason "stop". No rejection, no
    # warning, nothing to notice. Sending the wrong parameter name here means
    # unbounded output, not an error.
    max_tokens_param: max_tokens

    reasoning:
      supported: true
      # NOT measured directly: no probe sent a request with no knob and read
      # the reasoning tokens. Inferred from the endpoint's own refusal below,
      # "This model always engages in thinking".
      enabled_by_default: true
      # MEASURED: thinking:{"type":"disabled"} is refused outright —
      #   status 400, code 1210
      #   "This model always engages in thinking and cannot be disabled;
      #    please use low, high, or max"
      # Z.ai's own API reference documents the disable toggle as valid. It is
      # not, on this model. The measurement wins.
      can_be_disabled: false
      control: effort
      # MEASURED, exactly this set. The provider's global enum has seven values;
      # this model takes three. none, minimal, medium and xhigh are ALL refused
      # with the same code 1210 and the same message as the disable toggle —
      # so the code is overloaded across two unrelated conditions, and the
      # message names only a subset of what it rejects. Dispatching on the prose
      # would be wrong twice over.
      effort_values: [low, high, max]
      # NOT measured: the vendor's documented default and their recommendation
      # for this model.
      default_effort: max
      # MEASURED: reasoning arrived on this delta field on every probe.
      stream_field: reasoning_content

    # NOT measured, vendor documentation. Sent explicitly rather than omitted:
    # the endpoint's own fallbacks are materially lower than the vendor's
    # recommended operating point, so leaving these out does not mean "the
    # model's defaults" — it means running the model off the point it was tuned
    # for.
    temperature:
      supported: true
      recommended_value: 1.0
    top_p:
      supported: true
      recommended_value: 0.95

    tools:
      supported: true
      # NOT measured: the tool-format probes ran against MiMo only. Documented
      # as native; nothing has been seen to contradict it.
      format: native
      # Documented as auto-only. NOT measured: no probe offered a forced choice
      # to this endpoint, so this follows the doc and is the weakest line here.
      tool_choice_values: [auto]
      supports_forced_choice: false

    output:
      # MEASURED: accepted and the reply parsed as JSON.
      json_object: true
      # MEASURED: accepted and honoured, despite json_schema being absent from
      # Z.ai's OpenAPI enum and from their documentation entirely. A third-party
      # aggregator claimed support and was right.
      json_schema: true
      # MEASURED: the probe sent "strict": true inside the json_schema block.
      strict_schema: true

    streaming:
      supported: true
      # MEASURED both ways: usage arrives without asking, and the parameter is
      # accepted anyway (its request schema does not list it).
      needs_include_usage: false
      accepts_stream_options: true

    # NOT measured, vendor documentation.
    limits:
      context: 1000000
      max_output: 131072

    # NOT measured: the image probe ran against MiMo only. Vendor documentation.
    vision: true
    # NOT measured: vendor documentation. Only "stop" and "length" have been
    # seen from this endpoint.
    finish_reasons_extra: [sensitive, model_context_window_exceeded, network_error]

    # Published pay-as-you-go USD list rate, per 1M tokens, read from the
    # vendor's own page. models.dev carries 0.075 / 0.015 / 0.25 — exactly half
    # on every lane — and the reason is worth keeping: its entry for this model
    # is dated 2026-08-26, the model's own release day, and has not been touched
    # since. It is a launch-day snapshot presented as current. A backend that
    # sourced its rates there in August shipped figures at half the real price
    # for two weeks, and nothing in its own table could have revealed that.
    #
    # This is what source_url and verified_on are for. A catalogue is a
    # cross-check, never a source.
    #
    # cache_write is 0 because the vendor lists cached-input storage as
    # "Limited-time Free". That is a promotion, not a property: when it ends this
    # becomes a real rate, and the 0 here is an explicit measurement of what the
    # page said on verified_on, not an assumption that the lane is free.
    #
    # cache_read MEASURED 2026-09-13: cached_tokens sits INSIDE prompt_tokens
    # (9208 prompt / 0 cached, then 9208 / 9152 on the identical prompt), on
    # prompt_tokens_details.cached_tokens. The full-rate lane is the difference.
    #
    # NO WINDOW IS ATTACHED, deliberately. Z.ai documents a Mon-Fri 14:00-18:00
    # Asia/Singapore peak with everything else, weekends included, at 0.5x — but
    # documents it as a COEFFICIENT ON CREDIT BURN, and whether it touches the
    # USD lane is unverified (FINDINGS.md, "Still open"). Attaching 0.5x would
    # halve reported spend on the only priced chat model here, and a halved
    # figure silently doubles what a fail-closed budget cap permits. Assumption
    # until measured: the USD lane bills at list around the clock.
    cost:
      input: 0.15
      cache_read: 0.03
      cache_write: 0
      output: 0.50
      source_url: https://docs.z.ai/guides/overview/pricing
      verified_on: 2026-09-12

    notes: >-
      A 1024-token cap at reasoning_effort max produced 1022 stream frames and
      ZERO content characters: the whole budget went to reasoning. The cap counts
      reasoning tokens, so sizing it tightly on a deep call returns an empty
      answer with finish_reason "length" and no error.

  # ---------------------------------------------------------------------------
  # Xiaomi MiMo. Reached here over a Token Plan host, which bills subscription
  # credits rather than dollars. `provider: mimo` means THAT host; the
  # pay-as-you-go API is a different host with a different key and would be
  # its own provider.
  #
  # DEPRECATED BY THE VENDOR 2026-10-21, both entries below. They stay until the
  # endpoint stops serving the ids — as of 2026-09-22 the host's /models still
  # lists both — and mimo-v2.6-pro / mimo-v2.6-flash succeed them.
  #
  # Their cost blocks now outlive their source: the vendor's Overseas (USD)
  # table lists only the V2.6 ids, and V2.5 survives only in the domestic RMB
  # table marked "(deprecated)". So the source_url below no longer carries the
  # USD figures it is cited for. The rates are kept as verified on 2026-09-12
  # rather than dropped: they were read off that page when it did carry them,
  # and pricing something at Unpriced instead would silently zero the lane.
  # ---------------------------------------------------------------------------
  - id: mimo-v2.5-pro
    endpoint: chat
    wire_model_id: mimo-v2.5-pro
    provider: mimo
    verified: measured

    # MEASURED: this endpoint honours BOTH max_tokens and max_completion_tokens
    # — each returned exactly 16 tokens with finish_reason "length". The belief
    # that only max_completion_tokens works is too strong. The explicit one is
    # sent because it is the name the vendor documents.
    max_tokens_param: max_completion_tokens

    reasoning:
      supported: true
      # NOT measured: no probe sent the toggle to this endpoint in either
      # direction. Thinking is ON unless switched off, per the vendor; the
      # disable shape is vendor documentation.
      enabled_by_default: true
      can_be_disabled: true
      control: toggle_object
      # MEASURED 2026-09-13: reasoning_effort is taken BESIDE the toggle, and
      # the set is enforced by the endpoint: low, medium and high return 200,
      # xhigh is a 400 "Invalid request parameters". Whether the level changes
      # how much this deployment thinks is not shown by the probe: a small
      # arithmetic prompt answered in 9 completion tokens at every level AND
      # with no level sent (the control), so this prompt simply did not make
      # Pro think; sending a level does not switch thinking off. See mimo-v2.5
      # for the sibling that did move.
      effort_values: [low, medium, high]
      # MEASURED: reasoning arrived on this delta field on every probe.
      stream_field: reasoning_content

    # MEASURED behaviour, documented by the vendor: while thinking is on, these
    # are accepted and then FORCIBLY overridden to the model's own values. Not
    # rejected, not honoured. Sending them is harmless; believing they took
    # effect is not.
    temperature:
      supported: true
      inert_while_reasoning: true
    top_p:
      supported: true
      inert_while_reasoning: true

    tools:
      supported: true
      # MEASURED: native tool_calls, both with tools offered and on a forced
      # tool-free call. The model's own chat template emits XML, but the serving
      # layer parses it before it reaches a client.
      #
      # recover_inline_markup is ON although no probe reproduces the leak: loom
      # captured it in production against a long, tool-saturated history, as
      # <tool_call>…</tool_call> blocks and as an invented
      # <tool_invocation name=… arguments={…} /> form, on tool-free calls too.
      # Failing to reproduce is not refuting. Recovery only acts when the
      # markup appears, so a clean answer costs nothing.
      format: native
      recover_inline_markup: true
      # NOT measured, vendor documentation: documented auto-only; anything
      # else is silently DROPPED by the backend rather than rejected, so a
      # caller asking for a forced call would get an unforced one with no
      # error. No probe offered a forced choice here either.
      tool_choice_values: [auto]
      supports_forced_choice: false
      # NOT measured: no probe offered two tools in one turn.
      supports_parallel: true

    output:
      # MEASURED: accepted and the reply parsed as JSON.
      json_object: true
      # MEASURED: accepted and honoured, though the vendor documents only
      # json_object.
      json_schema: true
      # MEASURED: the probe sent "strict": true inside the json_schema block.
      strict_schema: true

    # MEASURED both ways: usage arrives without asking, and stream_options is
    # accepted.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: true

    # NOT measured, vendor documentation.
    limits:
      context: 1048576
      max_output: 131072

    # MEASURED: an image_url part returns HTTP 404, "No endpoints found that
    # support image input". Its sibling mimo-v2.5 accepts the same part. The
    # module errors rather than rerouting: they are different models with
    # different capabilities, and a silent swap would misattribute cost.
    vision: false
    # NOT measured: vendor documentation. Only "stop" and "length" have been
    # seen from this endpoint.
    finish_reasons_extra: [repetition_truncation]

    # Published pay-as-you-go USD list rate per 1M tokens, from the vendor's own
    # page. THIS IS NOT AN INVOICE: this deployment is reached over a Token Plan
    # host that bills subscription credits, and llmwire reports the list USD rate
    # anyway, because a credit figure is not comparable between models and
    # reporting nothing leaves a budget cap with nothing to check.
    #
    # A third-party integration doc quoted 1.00/3.00 for this model; the vendor
    # page says 0.435/0.87 and models.dev agrees with the vendor. Recorded
    # because it is the second price conflict in this file.
    #
    # cache_write 0: the vendor lists cache writes as "Limited-time Free" — a
    # promotion as of verified_on, not a property of the lane.
    cost:
      input: 0.435
      cache_read: 0.0036
      cache_write: 0
      output: 0.87
      source_url: https://mimo.mi.com/docs/en-US/price/pay-as-you-go
      verified_on: 2026-09-12

    notes: >-
      Latency is what to plan around, not tokens: single calls measured 25-64
      seconds, against 1-5 seconds for glm-5.3-flash on comparable prompts.
      Prompt caching is live and visible — a 258-token prompt reported 192 cached
      — because the endpoint injects its own system message when none is given.
      Measured 2026-09-13: cached_tokens sits INSIDE prompt_tokens (11131 / 192,
      then 11131 / 11072 on the identical prompt), so the full-rate lane is the
      difference and pricing subtracts it.
      reasoning_effort is accepted on chat/completions despite the vendor
      documenting it as a Responses-API parameter; see the reasoning block for
      the accepted set and what the probe measured.

  - id: mimo-v2.5
    endpoint: chat
    wire_model_id: mimo-v2.5
    provider: mimo
    verified: measured

    # Two bits were measured on this model: vision and the tool-call format.
    # Every other bit below is NOT measured; it is the -pro entry's value,
    # carried over on the strength of a shared serving layer and the vendor's
    # documentation. The output-cap, reasoning, response-format and usage
    # probes ran against -pro only.

    # NOT measured here; measured on -pro (both names honoured).
    max_tokens_param: max_completion_tokens

    # NOT measured, vendor documentation.
    reasoning:
      supported: true
      enabled_by_default: true
      can_be_disabled: true
      control: toggle_object
      # MEASURED 2026-09-13, same probe as -pro: low, medium, high accepted,
      # xhigh a 400. Here the level did move the answer: the same arithmetic
      # prompt took 225 / 377 / 396 completion tokens at low / medium / high
      # (one sample each, answer identical), while the reasoning_tokens lane
      # reported 0 throughout — the thinking is counted inside
      # completion_tokens on this endpoint.
      effort_values: [low, medium, high]
      stream_field: reasoning_content

    # NOT measured, vendor documentation; same statement as for -pro.
    temperature:
      supported: true
      inert_while_reasoning: true
    top_p:
      supported: true
      inert_while_reasoning: true

    tools:
      supported: true
      # MEASURED: native tool_calls, with tools offered and on a tool-free call.
      format: native
      # Same serving layer as -pro; see the note there.
      recover_inline_markup: true
      # NOT measured, vendor documentation.
      tool_choice_values: [auto]
      supports_forced_choice: false
      supports_parallel: true

    # NOT measured here; measured on -pro.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # NOT measured here; measured on -pro.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: true

    # NOT measured, vendor documentation.
    limits:
      context: 1048576
      max_output: 32768

    # MEASURED: accepts the same image part that 404s on -pro.
    vision: true
    # NOT measured: vendor documentation.
    finish_reasons_extra: [repetition_truncation]

    # Same page and same caveats as mimo-v2.5-pro above: list USD rate, not the
    # credit invoice this route actually bills, and cache_write is a promotion.
    cost:
      input: 0.14
      cache_read: 0.0028
      cache_write: 0
      output: 0.28
      source_url: https://mimo.mi.com/docs/en-US/price/pay-as-you-go
      verified_on: 2026-09-12

    notes: >-
      The vision-capable sibling of mimo-v2.5-pro. Not "the weaker model": it is
      the same reasoning family and thinks when asked to.


  # ---------------------------------------------------------------------------
  # MiMo V2.6, the successor generation, measured 2026-09-22 on the same Token
  # Plan host as the V2.5 pair above and with the same "list USD rate, not the
  # credit invoice" caveat.
  #
  # Nothing here is inherited from the V2.5 entries. Identical published prices
  # and an identically documented thinking toggle made a copy tempting, and a
  # copy would have shipped two wrong bits: V2.5-pro REJECTS image input and
  # V2.6-pro accepts it, and V2.5 reports a reasoning lane of 0 while V2.6
  # populates it. Every bit below is marked MEASURED or NOT measured.
  #
  # Both ids are served: the host's own /models listed mimo-v2.6-pro and
  # mimo-v2.6-flash beside the V2.5 family and the ASR/TTS models.
  # ---------------------------------------------------------------------------
  - id: mimo-v2.6-pro
    endpoint: chat
    wire_model_id: mimo-v2.6-pro
    provider: mimo
    verified: measured

    # MEASURED: this endpoint honours BOTH max_tokens and max_completion_tokens
    # — each returned exactly 16 tokens with finish_reason "length", the same
    # result as V2.5-pro. The explicit one is sent because it is the name the
    # vendor's own model card uses in its sample code.
    max_tokens_param: max_completion_tokens

    reasoning:
      supported: true
      # MEASURED 2026-09-22, and this is the first direct measurement of MiMo's
      # thinking toggle in either direction: both V2.5 entries carry these two
      # bools on vendor documentation alone.
      #
      # The card documents the disable shape as extra_body {"thinking":
      # {"type": "disabled"}}; extra_body is the OpenAI SDK's passthrough, so
      # on the wire it is a top-level "thinking" object. Sent as such it is
      # ACCEPTED AND HONOURED: on the arithmetic prompt below, reasoning tokens
      # went 54 -> 0 while the answer stayed correct ("205" both ways).
      #
      # enabled_by_default is read off the same pair: the request with NO knob
      # at all reported 54 reasoning tokens, so thinking is on unless switched
      # off. Worth contrasting with Z.ai, where the vendor also documents this
      # toggle and the endpoint refuses it outright (code 1210).
      enabled_by_default: true
      can_be_disabled: true
      control: toggle_object
      # MEASURED 2026-09-22: the set is enforced by the endpoint — low, medium
      # and high return 200, xhigh is a 400 "Invalid request parameters". Same
      # set as V2.5.
      #
      # What the levels DO is not established. One sample each on the same
      # prompt, reasoning tokens:
      #   no level  197
      #   low        67
      #   medium     69
      #   high       74
      # The three levels do not separate from each other; they only separate
      # from sending nothing, and in the direction a caller would not expect —
      # every level thought LESS than no level at all. Not reproduced on
      # -flash, where the same table reads 43 / 27 / 55 / 43. Treat the ladder
      # as accepted-and-flat until a probe with more samples says otherwise.
      effort_values: [low, medium, high]
      # NOT measured: reasoning arrived on every probe, but stream.go reads both
      # `reasoning_content` and `reasoning` and content wins, so which key the
      # delta carried cannot be read back out of a StreamResult. This is the
      # load default, not a measurement.
      stream_field: reasoning_content

    # NOT measured on this generation. supported stays true because these are
    # accepted — dropping the block would have Validate refuse a caller that
    # sends either — but inert_while_reasoning is deliberately ABSENT, unlike
    # the V2.5 entries: that bit rests on a vendor statement that the model
    # forcibly overrides both while thinking, and no V2.6 source has been found
    # repeating it. Absent means the warning is not emitted; it does not change
    # what is sent.
    temperature:
      supported: true
    top_p:
      supported: true

    tools:
      supported: true
      # MEASURED: native tool_calls, both with tools offered (name came back as
      # get_weather) and on a forced tool-free call, which returned clean prose
      # with no markup in either channel.
      format: native
      # recover_inline_markup is ON although no probe reproduces the leak here
      # either, for the same reason as the V2.5 entries: loom captured it in
      # production against a long, tool-saturated history that this probe does
      # not build. Failing to reproduce is not refuting, and recovery only acts
      # when the markup appears, so a clean answer costs nothing.
      recover_inline_markup: true
      # NOT measured: no probe offered a forced choice or two tools in one turn
      # to this endpoint. Vendor documentation, carried at the same values as
      # the rest of the family. tool_choice_values cannot be empty while tools
      # are supported, so this is the doc's value rather than an absence.
      tool_choice_values: [auto]
      supports_forced_choice: false
      supports_parallel: true

    output:
      # MEASURED: accepted and the raw reply parsed as JSON.
      json_object: true
      # MEASURED: accepted and honoured, though the model card documents only
      # "Structured Output" without naming the parameter.
      json_schema: true
      # MEASURED: the probe sent "strict": true inside the json_schema block.
      strict_schema: true

    # MEASURED both ways: usage arrives without asking (raw
    # completion_tokens/prompt_tokens/total_tokens plus
    # completion_tokens_details.reasoning_tokens and
    # prompt_tokens_details.cached_tokens), and stream_options is accepted.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: true

    # NOT measured, vendor model card: "Context Window 1M tokens" /
    # "Max Output 128K tokens". No probe sent a cap above the ceiling; every
    # endpoint measured so far clamps silently rather than erroring.
    limits:
      context: 1048576
      max_output: 131072

    # MEASURED 2026-09-22, and this REVERSES the V2.5 split. An image_url part
    # is ACCEPTED here, where the same part against mimo-v2.5-pro returns HTTP
    # 404 "No endpoints found that support image input" — re-confirmed as a
    # control in the same run. The vendor's own model card is self-contradictory
    # on this point: the prose sells "Omni-Modal Understanding" and "joint input
    # and understanding of images, video, audio, and text", while the
    # specification table on the same page lists "Input Modality: Text", and
    # OpenRouter documents text only. The prose is right.
    vision: true
    # NOT measured: vendor documentation. Only "stop" and "length" have been
    # seen from this endpoint.
    finish_reasons_extra: [repetition_truncation]

    # Published pay-as-you-go USD list rate per 1M tokens, from the vendor's own
    # page, Overseas (USD) table. THIS IS NOT AN INVOICE: this deployment is
    # reached over a Token Plan host that bills subscription credits, and
    # llmwire reports the list USD rate anyway, because a credit figure is not
    # comparable between models and reporting nothing leaves a budget cap with
    # nothing to check.
    #
    # No cross-check exists for this generation: models.dev carries no
    # mimo-v2.6 entry at all as of verified_on. Both earlier MiMo prices in this
    # file had a third-party figure to disagree with; this one stands on the
    # vendor page alone. The rates happen to equal mimo-v2.5-pro's exactly.
    #
    # cache_write 0: the vendor lists cache writes as "Limited-time Free" — a
    # promotion as of verified_on, not a property of the lane.
    #
    # Not attached, deliberately: the page also advertises a 50% Batch API
    # discount for this model. Batch is a different route with its own latency
    # contract, not a window on this one.
    cost:
      input: 0.435
      cache_read: 0.0036
      cache_write: 0
      output: 0.87
      source_url: https://mimo.mi.com/docs/en-US/price/pay-as-you-go
      verified_on: 2026-09-22

    notes: >-
      Succeeds mimo-v2.5-pro, which the vendor deprecates 2026-10-21, and
      differs from it in two ways a caller can trip over. It ACCEPTS image
      input where -pro returns 404, so the vision split this library used to
      route around does not exist at this generation. And it populates the
      reasoning lane: 197 of 202 completion tokens on one arithmetic prompt
      came back as reasoning_tokens, where mimo-v2.5 reported 0 and counted
      thinking inside completion_tokens. Code that read the lane as "this model
      does not think" will now see the real figure. Measured 2026-09-22:
      cached_tokens sits INSIDE prompt_tokens (0 then 10880 against a
      prompt_tokens of 10909 on the identical prompt), so the full-rate lane is
      the difference and pricing subtracts it. Unlike -pro this endpoint starts
      COLD — 0 cached on a fresh 10.9k prompt, where -pro reported 192 of 258
      because it injects its own system message. Latency is 1-5 seconds per
      call, not the 25-64 seconds the V2.5 notes describe. reasoning_effort is
      accepted with an enforced set despite appearing in no vendor document for
      this model; see the reasoning block for what the levels did and did not
      show.

  - id: mimo-v2.6-flash
    endpoint: chat
    wire_model_id: mimo-v2.6-flash
    provider: mimo
    verified: measured

    # MEASURED: both names honoured, 16 tokens with finish_reason "length",
    # same as -pro. The documented one is sent.
    max_tokens_param: max_completion_tokens

    reasoning:
      supported: true
      # MEASURED 2026-09-22, independently of -pro: the thinking toggle is
      # ACCEPTED AND HONOURED here too, reasoning tokens 42 -> 0, and the
      # no-knob control reported 42, so thinking is on by default.
      #
      # One caveat the -pro run did not show: with thinking disabled this model
      # answered the arithmetic prompt WRONG ("155" against the correct "205"
      # it gives with thinking on). One sample, so not a law — but disabling
      # thinking on this model is a quality decision, not just a latency one.
      enabled_by_default: true
      can_be_disabled: true
      control: toggle_object
      # MEASURED 2026-09-22: same enforced set as -pro, xhigh a 400 "Invalid
      # request parameters". The levels separate no better here, and not even in
      # -pro's direction — reasoning tokens were 43 with no level, then 27 / 55
      # / 43 for low / medium / high, one sample each. Accepted and flat.
      effort_values: [low, medium, high]
      # NOT measured, for the same reason as -pro: the delta key cannot be read
      # back out of a StreamResult. Load default.
      stream_field: reasoning_content

    # NOT measured; same reasoning as -pro above, including why
    # inert_while_reasoning is absent rather than carried over from V2.5.
    temperature:
      supported: true
    top_p:
      supported: true

    tools:
      supported: true
      # MEASURED: native tool_calls with tools offered, clean prose on a
      # tool-free call.
      format: native
      # Same serving layer and same defensive reasoning as -pro.
      recover_inline_markup: true
      # NOT measured, vendor documentation.
      tool_choice_values: [auto]
      supports_forced_choice: false
      supports_parallel: true

    # MEASURED: accepted, and the raw reply parsed as JSON in both shapes;
    # strict was sent inside the schema block.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # MEASURED both ways, same as -pro.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: true

    # NOT measured, vendor model card: 1M context / 128K max output. Note the
    # version delta — mimo-v2.5 shipped max_output 32768, so the ceiling on the
    # cheaper model moved 4x at this bump and now matches -pro.
    limits:
      context: 1048576
      max_output: 131072

    # MEASURED: accepts an image_url part, like its V2.5 predecessor and unlike
    # mimo-v2.5-pro. Carries the same card-versus-spec-table contradiction as
    # -pro; the prose is right here too.
    vision: true
    # NOT measured: vendor documentation.
    finish_reasons_extra: [repetition_truncation]

    # Same page, same table, same caveats as mimo-v2.6-pro above: list USD rate
    # rather than the credit invoice this route bills, no models.dev entry to
    # cross-check against, cache_write a promotion, and the 50% Batch API
    # discount deliberately not modelled as a window. Rates equal mimo-v2.5's
    # exactly.
    cost:
      input: 0.14
      cache_read: 0.0028
      cache_write: 0
      output: 0.28
      source_url: https://mimo.mi.com/docs/en-US/price/pay-as-you-go
      verified_on: 2026-09-22

    notes: >-
      Succeeds mimo-v2.5, which the vendor deprecates 2026-10-21. The vendor
      describes a 309B-parameter Mixture-of-Experts model with 15B activated per
      token, and gives it the same 1M/128K window as -pro where its predecessor
      had max_output 32768. Fastest endpoint measured in this file: 0.9-2.6
      seconds per call, and a longest data-frame gap of 522ms against the 90s
      idle bound. Like -pro it populates the reasoning lane rather than hiding
      thinking inside completion_tokens, starts with a cold cache, and contains
      cached_tokens inside prompt_tokens. Disabling thinking made it answer a
      one-step arithmetic prompt incorrectly in the one sample taken; see the
      reasoning block.
  # ---------------------------------------------------------------------------
  # OpenAI embeddings.
  # ---------------------------------------------------------------------------
  - id: text-embedding-3-small
    endpoint: embeddings
    wire_model_id: text-embedding-3-small
    provider: openai
    verified: source-derived
    limits:
      # Per-input token ceiling. The API reference says 8192 and the cookbook
      # says 8191; the lower figure is used, since the cost of being one token
      # conservative is nothing and the cost of being one over is a 400.
      context: 8191
    # Only the -3 generation takes the dimensions parameter; older embedding
    # models reject it outright, so this cannot be inferred from the endpoint.
    #
    # default_dimensions is what a caller builds its vector column and index to.
    # Full-length vectors from this model are unit length; a caller that shortens
    # one by hand must renormalise, which is why the dimensions PARAMETER is the
    # supported way to get a shorter vector.
    embedding:
      dimensions: true
      default_dimensions: 1536
    # One lane: there is no completion side to an embeddings call, and the other
    # three lanes must stay ABSENT rather than 0, so nothing reads "measured
    # free" where the truth is "no such lane".
    cost:
      input: 0.02
      source_url: https://developers.openai.com/api/docs/pricing
      verified_on: 2026-09-12
    notes: >-
      Over-length input is rejected, never truncated: at most 2048 inputs per
      request and 300000 tokens summed across them.

  - id: text-embedding-3-large
    endpoint: embeddings
    wire_model_id: text-embedding-3-large
    provider: openai
    verified: source-derived
    limits:
      context: 8191
    embedding:
      dimensions: true
      default_dimensions: 3072
    cost:
      input: 0.13
      source_url: https://developers.openai.com/api/docs/pricing
      verified_on: 2026-09-12
    notes: Same request limits as the -small model.

  # ---------------------------------------------------------------------------
  # OpenAI chat. Onboarded as the model behind a LiteLLM gateway route
  # (LLMWIRE_LITELLM_MODELS); nothing here was probed against api.openai.com,
  # every bit is the model page and the API reference, dated below.
  # ---------------------------------------------------------------------------
  - id: gpt-5.4-mini
    endpoint: chat
    wire_model_id: gpt-5.4-mini
    provider: openai
    verified: source-derived

    # NOT measured: the API reference deprecates max_tokens for the reasoning
    # series and names max_completion_tokens as the cap.
    max_tokens_param: max_completion_tokens

    # NOT measured, model page 2026-09-15: "supports reasoning effort levels of
    # none, low, medium, high, and xhigh". none is the off switch, so the model
    # can be told not to think. It thinks when the field is omitted (the
    # series' documented default is medium, which this model's own page does
    # not restate), so default_effort stays absent rather than guessed.
    reasoning:
      supported: true
      enabled_by_default: true
      can_be_disabled: true
      control: effort
      effort_values: [none, low, medium, high, xhigh]

    # NOT measured on this model; the gpt-5 series answers a non-default
    # temperature with a 400 ("Unsupported value ... Only the default (1) value
    # is supported"), which is the forced_value shape. Same for top_p.
    temperature:
      supported: true
      forced_value: 1.0
    top_p:
      supported: true
      forced_value: 1.0

    # NOT measured, API reference.
    tools:
      supported: true
      format: native
      tool_choice_values: [auto, none, required]
      supports_forced_choice: true
      supports_parallel: true

    # NOT measured, API reference: response_format json_object and json_schema
    # with strict.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # NOT measured, API reference: usage arrives in the stream only when
    # stream_options.include_usage is sent.
    streaming:
      supported: true
      needs_include_usage: true
      accepts_stream_options: true

    # NOT measured, model page: 400,000-token context, 128,000 maximum output.
    limits:
      context: 400000
      max_output: 128000

    # NOT measured, model page: text and image in, text out.
    vision: true

    # Pricing page, standard tier, same figures on the model page. cache_write
    # is 0: OpenAI charges nothing to write the prompt cache. Behind a gateway
    # this block is dropped and the proxy's own figure is used (Profile.resolve).
    cost:
      input: 0.75
      cache_read: 0.075
      cache_write: 0
      output: 4.50
      source_url: https://developers.openai.com/api/docs/pricing
      verified_on: 2026-09-15

    notes: >-
      Every bit source-derived. Reached directly it takes LLMWIRE_OPENAI_API_KEY
      like the embeddings do; the first route through a gateway is the first
      measurement of any of it.

  # ---------------------------------------------------------------------------
  # The full-size sibling. Same shape as gpt-5.4-mini, from its own model page
  # (developers.openai.com/api/docs/models/gpt-5.4, read 2026-09-15); the two
  # differ in what the page states differently, nothing else.
  # ---------------------------------------------------------------------------
  - id: gpt-5.4
    endpoint: chat
    wire_model_id: gpt-5.4
    provider: openai
    verified: source-derived

    # NOT measured: as gpt-5.4-mini, the reasoning series caps output with
    # max_completion_tokens.
    max_tokens_param: max_completion_tokens

    # NOT measured, model page 2026-09-15: "none (default), low, medium, high
    # and xhigh". Unlike mini, the page names the default: none. So the model
    # does NOT think when the field is omitted, and enabled_by_default is
    # false; can_be_disabled is true because none is an accepted value.
    reasoning:
      supported: true
      enabled_by_default: false
      can_be_disabled: true
      control: effort
      effort_values: [none, low, medium, high, xhigh]
      default_effort: none

    # NOT measured on this model; the series' 400 on a non-default
    # temperature, as gpt-5.4-mini.
    temperature:
      supported: true
      forced_value: 1.0
    top_p:
      supported: true
      forced_value: 1.0

    # NOT measured, API reference.
    tools:
      supported: true
      format: native
      tool_choice_values: [auto, none, required]
      supports_forced_choice: true
      supports_parallel: true

    # NOT measured, API reference.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # NOT measured, API reference.
    streaming:
      supported: true
      needs_include_usage: true
      accepts_stream_options: true

    # NOT measured, model page: 1,050,000-token context, 128,000 maximum
    # output. Prompts past 272K input tokens are billed at 2x input and 1.5x
    # output for the whole session; the cost block below is the rate under it.
    limits:
      context: 1050000
      max_output: 128000

    # NOT measured, model page: text and image in, text out.
    vision: true

    # Model page, standard tier, under 272K input tokens. cache_write 0 as for
    # mini. Behind a gateway this block is dropped (Profile.resolve).
    cost:
      input: 2.50
      cache_read: 0.25
      cache_write: 0
      output: 15.00
      source_url: https://developers.openai.com/api/docs/models/gpt-5.4
      verified_on: 2026-09-15

    notes: >-
      Every bit source-derived, as gpt-5.4-mini. The one fact the page states
      that mini's does not: the default effort is none, so an omitted field
      means no thinking.

  # ---------------------------------------------------------------------------
  # gpt-5.5, from its model page (developers.openai.com/api/docs/models/gpt-5.5,
  # read 2026-09-15). Same shape as gpt-5.4; the page names medium as the
  # default effort, so this one thinks when the field is omitted.
  # ---------------------------------------------------------------------------
  - id: gpt-5.5
    endpoint: chat
    wire_model_id: gpt-5.5
    provider: openai
    verified: source-derived

    # NOT measured: the reasoning series caps output with
    # max_completion_tokens.
    max_tokens_param: max_completion_tokens

    # NOT measured, model page 2026-09-15: "none, low, medium (default), high
    # and xhigh". none is accepted, so it can be told not to think.
    reasoning:
      supported: true
      enabled_by_default: true
      can_be_disabled: true
      control: effort
      effort_values: [none, low, medium, high, xhigh]
      default_effort: medium

    # NOT measured on this model; the series' 400 on a non-default
    # temperature, as gpt-5.4.
    temperature:
      supported: true
      forced_value: 1.0
    top_p:
      supported: true
      forced_value: 1.0

    # NOT measured, API reference.
    tools:
      supported: true
      format: native
      tool_choice_values: [auto, none, required]
      supports_forced_choice: true
      supports_parallel: true

    # NOT measured, API reference.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # NOT measured, API reference.
    streaming:
      supported: true
      needs_include_usage: true
      accepts_stream_options: true

    # NOT measured, model page: 1,050,000-token context, 128,000 maximum
    # output. Past 272K input tokens the session bills 2x input, 1.5x output.
    limits:
      context: 1050000
      max_output: 128000

    # NOT measured, model page: text and image in, text out.
    vision: true

    # Model page, standard tier, under 272K input tokens. cache_write 0 as for
    # the rest of the series. Behind a gateway this block is dropped.
    cost:
      input: 5.00
      cache_read: 0.50
      cache_write: 0
      output: 30.00
      source_url: https://developers.openai.com/api/docs/models/gpt-5.5
      verified_on: 2026-09-15

    notes: >-
      Every bit source-derived. Thinks at medium unless told otherwise, so a
      caller with a tight output cap sends none or raises the cap.
