  # ---------------------------------------------------------------------------
  # gpt-6.1-sol, from its model page (developers.openai.com/api/docs/models/
  # gpt-6.1-sol, read 2026-10-14) and the pricing page. A new series, so
  # nothing is carried from gpt-5.x without saying so. Two breaks from the
  # gpt-5.x shape: thinking cannot be switched off, and tools need the
  # Responses protocol.
  #
  # MEASURED 2026-10-19 through LiteLLM 1.105.1 -> Azure Switzerland North
  # (`gpt-6.1-sol-2026-09-29`, upstream /openai/v1/responses?api-version=
  # preview), the route via LLMWIRE_LITELLM_MODELS. Chat Completions with a
  # tool refused: "Function tools with reasoning_effort are not supported for
  # ai-gateway-gpt-6.1-sol in /v1/chat/completions. To use function tools, use
  # /v1/responses or set reasoning_effort to 'none'." (param reasoning_effort,
  # code "400"). So this profile speaks Responses, where tools and reasoning
  # work together and the encrypted reasoning is replayed across tool rounds
  # (responses.go head comment). Not probed against api.openai.com directly;
  # the model page agrees: "Use the Responses API for tool calling."
  # ---------------------------------------------------------------------------
  - id: gpt-6.1-sol
    display_name: GPT-6.1 Sol
    endpoint: chat
    wire_api: responses
    wire_model_id: gpt-6.1-sol
    provider: openai
    verified: source-derived

    # The Responses protocol's only cap spelling. MEASURED: echoed back as
    # max_output_tokens 4000.
    max_tokens_param: max_output_tokens

    # NOT measured, model page 2026-10-14: "`reasoning.effort` supports `low`,
    # `medium` (default), `high`, `xhigh`, and `max`." and "The `none` and
    # `minimal` reasoning efforts are not supported." So it always thinks:
    # ReasoningMinimal resolves to low, ReasoningOff is refused. MEASURED: high
    # and low accepted on /responses; a trivial prompt reports
    # reasoning_tokens 0 even at high, an arithmetic one 34.
    reasoning:
      supported: true
      enabled_by_default: true
      can_be_disabled: false
      control: effort
      effort_values: [low, medium, high, xhigh, max]
      default_effort: medium
      # NOT measured, a choice: the documented default, as on gpt-5.x.
      # overhead ABSENT: DefaultReasoningOverhead applies.
      balanced: medium

    # temperature and top_p ABSENT: this page says nothing about either, and
    # gpt-5.x's forced_value 1.0 is not carried across a series boundary. A
    # caller sending either is refused in plan until a probe reads the shape.
    # (Azure echoes temperature 1.0, top_p 0.98 unasked; not a measurement of
    # what it accepts.)

    # MEASURED via the route above, each with a prompt that never asked for a
    # tool where that matters: "Say hello." under tool_choice required and
    # under the forced {"type":"function","name":"get_weather"} both returned
    # a get_weather call; none returned prose although the prompt demanded
    # the tool; two tools in one turn returned two function_call items.
    tools:
      supported: true
      format: native
      tool_choice_values: [auto, required, none]
      supports_forced_choice: true
      supports_parallel: true

    # MEASURED via the route above: text.format json_schema with strict true
    # accepted and the reply parsed. json_object NOT measured, model page.
    output:
      json_object: true
      json_schema: true
      strict_schema: true

    # MEASURED via the route above: streams, usage on response.completed
    # whatever the request says; Responses has no stream_options.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: false

    # NOT measured, model page: 1,050,000-token context, 128,000 maximum
    # output, "maximum input: 922,000". Long-context pricing is the tier in
    # the cost block.
    limits:
      context: 1050000
      max_output: 128000

    # NOT measured, model page: text and image in, text out.
    vision: true

    # Pricing page, standard tier, short context (<= 272K input tokens):
    # 2.00 / 0.10 cached / 2.50 cache write / 10.00. cache_write is 0 HERE,
    # not 2.50, per the usage.go head comment: no shipped cache_write rate is
    # non-zero before a probe reads whether cache_write_tokens sits inside or
    # beside prompt_tokens. Either way 0 UNDER-reports: inside, written tokens
    # price at the input rate, 0.50 per million short; beside, they price at
    # nothing, 2.50 short. 2.50 would over-report by 2.00 if inside. Behind a
    # gateway this block is dropped.
    cost:
      input: 2.00
      cache_read: 0.10
      cache_write: 0
      output: 10.00
      # Model page: "Prompts with more than 272K input tokens are priced at
      # 2x input and cache rates and 1.5x output for the full request."
      # Pricing page long-context row 4.00 / 0.20 / 5.00 / 15.00 agrees.
      tiers:
        - name: long-context
          min_input_tokens: 272001
          multiplier_permille: 2000
          output_multiplier_permille: 1500
      source_url: https://developers.openai.com/api/docs/pricing
      verified_on: 2026-10-14

    notes: >-
      Tools, structured output and streaming measured via LiteLLM/Azure;
      the rest source-derived. Always thinks (low at the least, medium by
      default) and cannot be told not to, so a caller with a tight output cap
      raises the cap. MaxAnswerTokens adds DefaultReasoningOverhead (1024), not
      a measured figure, and at xhigh or max that is likely short: expect
      finish_reason length with an empty answer until an overhead is measured.
      Speaks the Responses protocol (wire_api: responses), the only one on
      which it takes tools while thinking; a tool loop appends
      resp.Assistant() so the encrypted reasoning goes back each round. No
      stop sequences on that protocol. Behind LiteLLM 1.105.1 the stream is
      faked (nothing until the answer is complete) unless the gateway catalog
      aliases azure/<deployment>; there, size the header bound to the call.
      responses.go head comment.

  # ---------------------------------------------------------------------------
  # Anthropic, its own API (provider anthropic, wire_api messages). Sources:
  # the API reference and the claude-api skill reference for claude-opus-5-5
  # (cached 2026-10-06), and the pricing page read 2026-10-26. MEASURED
  # 2026-10-26 on api.anthropic.com (eval_messages_test.go, FINDINGS.md).
  # ---------------------------------------------------------------------------
  - id: claude-opus-5-5
    display_name: Claude Opus 5.5
    endpoint: chat
    wire_api: messages
    wire_model_id: claude-opus-5-5
    provider: anthropic
    verified: measured

    # The protocol's only cap spelling, and required on every request: an
    # uncapped request goes out at limits.max_output. MEASURED: a
    # non-streamed call at 128000 accepted.
    max_tokens_param: max_tokens

    # MEASURED: low, medium, high, xhigh and max accepted; none and minimal a
    # 400 ("Input should be 'low', 'medium', 'high', 'xhigh' or 'max'");
    # thinking.type disabled and enabled (budget_tokens) both a 400: "Use
    # \"thinking.type.adaptive\" and \"output_config.effort\" to control
    # thinking behavior." ReasoningMinimal resolves to low. default_effort NOT
    # measured, skill reference.
    reasoning:
      supported: true
      enabled_by_default: true
      can_be_disabled: false
      control: effort
      effort_values: [low, medium, high, xhigh, max]
      default_effort: medium
      # NOT measured, a choice: the documented default.
      balanced: medium
      # overhead ABSENT, and DefaultReasoningOverhead (1024) is far short at
      # high and above: MEASURED, a counting problem at high thought through
      # the whole 16000-token cap and returned no answer.

    # MEASURED: temperature and top_p each a 400, "Extra inputs are not
    # permitted"; refused on every model under anthropic-version 2026-10-21.
    temperature:
      supported: false
    top_p:
      supported: false

    # MEASURED: tool_choice any and tool a 400, "tool_choice: type \"tool\"
    # and \"any\" are not supported for this model.", so required and a named
    # function relax to auto with a warning. The tool loop with a thinking
    # replay measured accepted, so was a hand-built tool turn with no thinking
    # block. Parallel calls NOT measured.
    tools:
      supported: true
      format: native
      tool_choice_values: [auto, none]
      supports_forced_choice: false
      supports_parallel: true

    # MEASURED: output_config.format json_schema, the reply parsed. Constrained
    # decoding, enforced whatever strict says (skill reference). No
    # json_object mode.
    output:
      json_object: false
      json_schema: true
      strict_schema: true

    # MEASURED: usage on message_start and message_delta unasked; no
    # stream_options on this protocol. A long think streams summarized
    # thinking_delta frames at most 4.8s apart, with one ping in 2m40s.
    streaming:
      supported: true
      needs_include_usage: false
      accepts_stream_options: false

    # MEASURED, the models listing: max_input_tokens 1000000, max_tokens 128000.
    limits:
      context: 1000000
      max_output: 128000

    # NOT measured, model overview: text and image in, text out.
    vision: true

    # MEASURED: a request ending on an assistant turn is a 400, "This model
    # does not support assistant message prefill. The conversation must end
    # with a user message." One opening on an assistant turn was accepted.
    assistant_prefill: false

    # Pricing page 2026-10-26: base input 4, 5-minute cache write 5 (1.25x),
    # 1-hour cache write 8 (2x), cache read 0.20 (0.05x), output 20. The full
    # 1M window at these rates, no long-context tier. MEASURED containment:
    # cache writes and reads sit beside input_tokens (FINDINGS.md), so the
    # write lane is priced on top, never subtracted. cache_write is the
    # 5-minute rate: llmwire sends no cache_control, and a call that wrote to
    # the 1-hour cache through ExtraBody is Unpriced rather than under-priced
    # (pricing.go). speed "fast" (2x) and inference_geo "us" (1.1x) are
    # refused in ExtraBody for the same reason.
    cost:
      input: 4.00
      cache_read: 0.20
      cache_write: 5.00
      output: 20.00
      source_url: https://platform.claude.com/docs/en/about-claude/pricing
      verified_on: 2026-10-26

    finish_reasons_extra: [content_filter, pause_turn, model_context_window_exceeded]

    notes: >-
      Speaks Anthropic's Messages protocol (wire_api: messages); the caller's
      API is unchanged. Always thinks, medium by default, and cannot be told
      not to; thinking is requested as a summary so Reasoning carries text and
      a long think streams. At high and above a think can fill the whole cap:
      MaxAnswerTokens adds only DefaultReasoningOverhead, so expect
      finish_reason length with no answer on a hard prompt until an overhead
      is measured. A tool loop appends resp.Assistant() so the signed
      thinking blocks go back each round. No forced tool choice, no
      temperature or top_p, no json_object. Caching is opt-in through
      ExtraBody cache_control. messages.go head comment.
