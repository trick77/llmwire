name: Release

# By hand only. No images: go build, next v-tag from the bump and a GitHub release.
# gh workflow run Release -f bump=patch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: trick77/ship/.github/workflows/release.yaml@master
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write
