version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: weekly
      day: sunday
      time: "07:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      gomod-non-major:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      gomod-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    commit-message: { prefix: deps }   # Go style: "deps: bump …"
    schedule:
      interval: weekly
      day: sunday
      time: "07:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
